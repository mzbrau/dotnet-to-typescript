name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      id-token: write # Required for NuGet Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Source/DotnetToTypescript.sln

    - name: Build
      run: |
        set -o pipefail
        dotnet build Source/DotnetToTypescript.sln --configuration Release --no-restore 2>&1 | tee build.log

    - name: Test
      run: >
        dotnet test Source/DotnetToTypescript.sln --configuration Release --no-build
        --results-directory ./test-results
        --logger "trx;LogFileName=results.trx"
        --collect:"XPlat Code Coverage"

    - name: Publish test report
      uses: mzbrau/actions-insights@v1
      if: always()
      continue-on-error: true
      with:
        test-results: '**/results.trx'
        comment-mode: off
        coverage-enabled: true
        coverage-files: '**/coverage.cobertura.xml'
        diagnostics-enabled: true
        diagnostics-files: 'build.log'
        history-enabled: true
        history-repository: 'mzbrau/mzbrau-actions-insights'
        history-token: ${{ secrets.ACTIONS_INSIGHTS_HISTORY_TOKEN }}

    - name: Pack
      run: dotnet pack Source/DotnetToTypescript/DotnetToTypescript.csproj --configuration Release --no-build -o nupkg

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: >
        dotnet nuget push nupkg/*.nupkg
        --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
